<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MidSouth Utility App</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body>
  <header class="topbar"><h1>MidSouth Utility App</h1></header>
  <nav class="tabs" aria-label="Primary navigation">
    <button class="nav-item active" data-tab="budget" type="button">Budget</button>
    <button class="nav-item" data-tab="receipts" type="button">Receipts</button>
  </nav>
  <main>
    <section id="tab-budget" class="tab active">
      <h2>Budget</h2>
      <label>Monthly income <input id="monthlyIncome" type="number" step="0.01"></label>
      <button id="rolloverBtn" type="button">Rollover Month</button>
    </section>
    <section id="tab-receipts" class="tab">
      <h2>Receipt Scanner</h2>
      <div class="controls">
        <button id="startCameraBtn" type="button">Start Camera</button>
        <button id="captureReceiptBtn" type="button" disabled>Capture Receipt</button>
        <button id="runOcrBtn" type="button" disabled>Read Receipt Text</button>
      </div>
      <label>Amount <input id="receiptAmount" type="number" step="0.01"></label>
      <label>Note <input id="receiptNote" type="text"></label>
      <div class="preview-wrap">
        <video id="cameraVideo" playsinline autoplay></video>
        <div class="preview-label">Live preview before OCR capture</div>
      </div>
      <canvas id="captureCanvas" hidden></canvas>
      <pre id="ocrOutput" class="ocr-output"></pre>
      <h3>Saved Receipts</h3>
      <div id="receiptsList"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
