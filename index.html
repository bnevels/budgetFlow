<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="googlebot" content="noindex,nofollow,noarchive" />
  <title>Budget Flow Pro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Private test build</p>
      <h1>Budget Flow Pro</h1>
    </div>
    <button id="themeToggleBtn" class="secondary" type="button" aria-pressed="false">Dark Mode</button>
  </header>

  <nav class="tabs" aria-label="Primary navigation">
    <button class="nav-item active" data-tab="budget" type="button">Budget</button>
    <button class="nav-item" data-tab="receipts" type="button">Receipts</button>
  </nav>

  <main>
    <section id="tab-budget" class="tab active">
      <div class="card">
        <h2>Budget</h2>
        <label>Monthly income <input id="monthlyIncome" type="number" step="0.01" inputmode="decimal"></label>
        <button id="rolloverBtn" type="button">Rollover Month</button>
      </div>
    </section>

    <section id="tab-receipts" class="tab">
      <div class="card">
        <h2>Receipt Scanner</h2>
        <p class="helper">Use the camera on HTTPS or Netlify. Capture a receipt, read the text, then save it. You can also enter the amount manually and save.</p>

        <div class="controls">
          <button id="startCameraBtn" type="button">Start Camera</button>
          <button id="captureReceiptBtn" type="button" disabled>Capture Receipt</button>
          <button id="runOcrBtn" type="button" disabled>Read Receipt Text</button>
          <button id="saveReceiptBtn" type="button" disabled>Save Receipt</button>
        </div>

        <div id="statusMessage" class="status" role="status" aria-live="polite"></div>

        <label>Amount <input id="receiptAmount" type="number" step="0.01" inputmode="decimal"></label>
        <label>Vendor / Note <input id="receiptNote" type="text" autocomplete="off"></label>

        <div class="preview-wrap">
          <video id="cameraVideo" playsinline autoplay muted></video>
          <img id="receiptPreview" class="receipt-preview" alt="Captured receipt preview" hidden>
          <div class="preview-label">Live preview / captured image</div>
        </div>

        <canvas id="captureCanvas" hidden></canvas>
        <pre id="ocrOutput" class="ocr-output"></pre>
      </div>

      <div class="card">
        <div class="section-header">
          <h3>Saved Receipts</h3>
          <button id="clearReceiptsBtn" class="secondary danger" type="button">Clear Receipts</button>
        </div>
        <div id="receiptsList"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
