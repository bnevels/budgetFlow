name: Build Budget Flow Pro Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-app-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build app.zip bundle
        run: |
          zip -r BudgetFlowPro-app.zip \
            index.html app.js styles.css manifest.json sw.js \
            install-budget-flow-pro.bat electron/main.js package.json \
            INSTALL.md

      - name: Upload app.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetFlowPro-app
          path: BudgetFlowPro-app.zip

  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Flow-Pro-Windows-Installer
          path: dist/**/*.exe
